<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Hello World</title>
</head>
<body>
  <h1 id="mensagem">Carregando...</h1>
  <script>
    fetch("http://localhost:5000/hello")
      .then(r => r.json())
      .then(d => document.getElementById("mensagem").textContent = d.mensagem)
      .catch(() => document.getElementById("mensagem").textContent = "Erro ao acessar o backend");
  </script>
</body>
</html>
