<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiniC Analisador</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
      margin: 0;
      padding: 24px 16px;
    }
    main {
      max-width: 800px;
      margin: 0 auto;
      background: #fff;
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }
    h1 { margin: 0 0 4px; }
    .subtitulo { margin: 0 0 24px; color: #555; }
    label { display: block; margin: 16px 0 6px; font-weight: 600; }
    select, textarea, button { font-size: 1rem; }
    select { padding: 6px; width: 100%; }
    textarea {
      width: 100%;
      min-height: 220px;
      box-sizing: border-box;
      padding: 10px;
      font-family: "Courier New", Consolas, monospace;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      margin-top: 12px;
      padding: 10px 24px;
      background: #1f6feb;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:disabled { background: #8aaee8; cursor: wait; }
    .resultado {
      min-height: 48px;
      padding: 12px;
      border-radius: 4px;
      background: #f0f0f0;
      white-space: pre-wrap;
    }
    .resultado.sucesso { background: #e6f4ea; color: #1e6b34; }
    .resultado.erro { background: #fdecea; color: #a12622; }
    .resultado.info { background: #e8f0fe; color: #1a4c9c; }
  </style>
</head>
<body>
  <main>
    <h1>MiniC Analisador</h1>
    <p class="subtitulo">Software educacional de compiladores. Linguagem analisada: subconjunto da linguagem C (MiniC).</p>

    <label for="exemplos">Exemplos de programas</label>
    <select id="exemplos">
      <option value="">Selecione um exemplo...</option>
      <option value="declaracao">Exemplo 1: Declaração e inicialização de variáveis</option>
      <option value="aritmetica">Exemplo 2: Operações aritméticas</option>
      <option value="condicional">Exemplo 3: Estrutura condicional</option>
      <option value="erro">Exemplo 4: Código com erro intencional</option>
    </select>

    <label for="codigo">Código-fonte</label>
    <textarea id="codigo" spellcheck="false" placeholder="Escreva ou cole aqui um programa em MiniC..."></textarea>

    <button id="analisar" type="button">Analisar</button>

    <label for="resultado">Resultado</label>
    <div id="resultado" class="resultado" role="status" aria-live="polite">Nenhuma análise realizada.</div>
  </main>

  <script src="app.js"></script>
</body>
</html>
