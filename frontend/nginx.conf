server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # As explicações da IA podem demorar mais que os 60s padrão do Nginx quando o
    # modelo roda na CPU; por isso este location vem antes de /api/ e amplia o tempo.
    location /api/ia/ {
        proxy_pass http://backend:5000;
        proxy_read_timeout 150s;
    }

    location /api/ {
        proxy_pass http://backend:5000;
    }
}
